[package]
name = "link-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Link Code GTK4 user interface"

[dependencies]
link-core = { path = "../link-core" }
link-models = { path = "../link-models" }
link-tools = { path = "../link-tools" }

serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
regex.workspace = true
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
tracing-subscriber.workspace = true
# A real pseudo-terminal for the bottom panel, with a VT parser to render it
# into a GTK text view (no VTE dependency required).
portable-pty = "0.9"
vt100 = "0.15"

[dev-dependencies]
tempfile.workspace = true
