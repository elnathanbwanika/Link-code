[package]
name = "link-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Link Code application binary"

[[bin]]
name = "link-code"
path = "src/main.rs"

[dependencies]
link-ui = { path = "../link-ui" }
# Persist API keys in the OS keyring (libsecret). The feature lives here so the
# libraries still build/test on machines without a Secret Service.
link-core = { path = "../link-core", features = ["keyring"] }
